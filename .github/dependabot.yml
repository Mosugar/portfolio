version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Minor and patch bumps land in one PR; majors stay separate so each can be tested
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Paris
    commit-message:
      prefix: "ci"
