name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push on the same PR cancels the run that is now out of date
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Also runs scripts/prerender.mjs (per-project HTML + sitemap)
      - name: Build
        run: npm run build
